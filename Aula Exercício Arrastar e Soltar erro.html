<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arrastar e Soltar com Validação</title>
    <style>
        .caixa {
            width: 100px;
            height: 100px;
            border: 2px dashed blue;
            margin: 10px;
            display: inline-block;
        }
    
        .item {
            width: 80px;
            height: 80px;
            background-color: #f00;
            text-align: center;
            line-height: 80px;
            color: #fff;
            cursor: grab;
        }
        .erro {
            color: red;
            font-weight: bold;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>Arrastar e Soltar com Validação</h1>
    <div id="caixaDestino" class="caixa" ondrop="soltar(event)" ondragover="permitirSoltar(event)"></div>
    <div id="itemCorreto" class="item" draggable="true" ondragstart="arrastar(event)">Correto</div>
    <div id="itemIncorreto" class="item" draggable="true" ondragstart="arrastar(event)" style="background-color: #00f;">Incorreto</div>
    <p id="mensagemErro" class="erro"></p>

    <script>
        function arrastar(event) {
            event.dataTransfer.setData("text", event.target.id);
        }

        function permitirSoltar(event) {
            event.preventDefault();
        }

        function soltar(event) {
            event.preventDefault();
            const idItem = event.dataTransfer.getData("text");
            const item = document.getElementById(idItem);
            const caixaDestino = document.getElementById("caixaDestino");

            if (idItem === "itemCorreto") {
                caixaDestino.appendChild(item);
                document.getElementById("mensagemErro").textContent = ""; // Limpa a mensagem de erro
            } else {
                document.getElementById("mensagemErro").textContent = "Erro: você tentou soltar o item errado!";
            }
        }
    </script>
</body>
</html>
