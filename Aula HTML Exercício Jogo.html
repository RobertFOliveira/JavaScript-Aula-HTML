<!DOCTYPE HTML>
<html lang="pt-br">

<head>
    <style>
        #div1 {
            width: 200px;
            height: 70px;
            padding: 10px;
            border-radius: 50px;
            background-color: yellow;
            display: inline-block;
            transition: transform 0.3s ease, background-color 0.3s ease;
        }
        #div1:hover {
            transform: scale(1.1); /* Aumenta ligeiramente o tamanho */
            cursor: pointer;
        }
    </style>
    <STYle>
        #div2 {
            width: 200px;
            height: 70px;
            padding: 10px;
            border-radius: 50px;
            background-color: red;
            display: inline-block;
            transition: transform 0.3s ease, background-color 0.3s ease;
        }
        #div2:hover {
            transform: scale(1.1); /* Aumenta ligeiramente o tamanho */
            cursor: pointer;
        }
    </STYle>
    <STYle>
        #div3 {
            width: 200px;
            height: 70px;
            padding: 10px;
            border-radius: 50px;
            background-color: blue;
            display: inline-block;
            transition: transform 0.3s ease, background-color 0.3s ease;
        }
        #div3:hover {
            transform: scale(1.1); /* Aumenta ligeiramente o tamanho */
            cursor: pointer;
        }
    </STYle>
    <STYle>
        #div4 {
            width: 200px;
            height: 70px;
            padding: 10px;
            border-radius: 50px;
            background-color: green;
            display: inline-block;
            transition: transform 0.3s ease, background-color 0.3s ease;
        }
        #div4:hover {
            transform: scale(1.1); /* Aumenta ligeiramente o tamanho */
            cursor: pointer;
        }
    </STYle>
    <script>
        function dragstartHandler(ev) {
            ev.dataTransfer.setData("text", ev.target.id);
        }

        function dragoverHandler(ev) {
            ev.preventDefault();
        }

        function dropHandler(ev) {
            ev.preventDefault();
            const data = ev.dataTransfer.getData("text");
            ev.target.appendChild(document.getElementById(data));

        }
   
    </script>

</head>

<body>

    <h1>Jogo Arrastar e Soltar</h1>

    <h2>Arraste o nome de cada cor</h2>
    <hr><br>

    <h1 id="h1" draggable="true" ondragstart="dragstartHandler(event)">yellow</h1>
    <h1 id="h1" draggable="true" ondragstart="dragstartHandler(event)">red</h1>
    <h1 id="h1" draggable="true" ondragstart="dragstartHandler(event)">blue</h1>
    <h1 id="h1" draggable="true" ondragstart="dragstartHandler(event)">green</h1>

    <div id="div1" ondrop="dropHandler(event)" ondragover="dragoverHandler(event)"></div>
    <div id="div2" ondrop="dropHandler(event)" ondragover="dragoverHandler(event)"></div>
    <div id="div3" ondrop="dropHandler(event)" ondragover="dragoverHandler(event)"></div>
    <div id="div4" ondrop="dropHandler(event)" ondragover="dragoverHandler(event)"></div>


</body>

</html>
